<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播欢迎助手 · 控制台</title>
<style>
:root{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;color:#23344c;background:#edf2f8}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:45px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;margin:8px 0}p{line-height:1.8;color:#60728a}.badge{font-size:13px;background:#dbe9fa;padding:9px 14px;border-radius:20px;color:#285e9f}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:26px}.preview{background:#dfe9f5;border-radius:24px;overflow:hidden;position:relative;min-height:610px}.preview iframe{width:100%;height:610px;border:0}.caption{position:absolute;left:24px;top:20px;font-size:14px;color:#48617b;pointer-events:none}.panel{background:white;border-radius:20px;padding:26px;margin-bottom:18px}h2{font-size:19px;margin:0 0 18px}label{display:block;font-size:14px;margin:16px 0 8px}input{font:inherit;width:100%;padding:12px;border:1px solid #bbc9dc;border-radius:8px}button,a.button{font:inherit;display:inline-block;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;background:#356bb5;color:white;text-decoration:none}button.secondary,a.secondary{background:#e8eef7;color:#294d7a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#result{min-height:42px;font-size:14px;color:#285e9f;line-height:1.6;margin-top:16px}.rule{border-left:3px solid #568bc9;padding-left:14px;font-size:14px}#logs{font-size:13px;max-height:150px;overflow:auto;line-height:1.9;color:#56677b}.log{padding:4px 0;border-bottom:1px solid #edf1f6}a{color:#356bb5}button:focus-visible,a:focus-visible{outline:3px solid #edb543;outline-offset:3px}@media(max-width:850px){.layout{grid-template-columns:1fr}header{display:block}.badge{display:inline-block}.preview{min-height:500px}.preview iframe{height:500px}}
</style>
<main><header><div><h1>给每次到来，一声欢迎。</h1><p>Live2D 角色 · 昵称语音 · 欢迎气泡</p></div><span class="badge" id="mode">本地模拟 · 未连接抖音</span></header>
<div class="layout"><section class="preview"><div class="caption">角色预览 / 点击启用声音后模拟进房</div><iframe id="preview" src="/overlay?preview=1" allow="autoplay" title="Live2D 欢迎角色"></iframe></section><div>
<section class="panel"><h2>连接抖音直播间</h2><label for="room">直播间链接或整段分享文字</label><input id="room" placeholder="粘贴抖音链接或直播间号" maxlength="3000"><div class="actions"><button id="connect">连接直播间</button><button id="disconnect" class="secondary">断开连接</button></div><div class="actions"><button id="bind" class="secondary">记住当前直播间</button><button id="unbind" class="secondary">取消绑定</button></div><p id="binding" style="font-size:13px">未绑定直播间</p><p id="connection" role="status" style="font-size:13px">尚未连接。先启用角色声音，再连接直播间。</p><div id="connection-error" role="alert" style="color:#a52929;font-size:13px"></div></section>
<section class="panel"><h2>模拟观众进入</h2><label for="name">观众昵称</label><input id="name" value="小明" maxlength="30"><label for="uid">观众 ID（相同 ID 视为同一个人）</label><input id="uid" value="demo-001" maxlength="80"><div class="actions"><button id="enter">模拟进房</button><button id="new" class="secondary">换一个观众</button></div><div id="result" role="status">先点击左侧「启用欢迎声音」，再模拟进房。</div><div class="rule">同一观众首次触发后，60 秒内再次进入不提示；满 60 秒后再次进入，重新欢迎。被忽略的进房不会延长计时。</div></section>
<section class="panel"><h2>播放与采集</h2><div class="actions"><button id="mute" class="secondary">暂停欢迎</button><button id="open" class="secondary">打开独立角色窗口</button></div><p style="font-size:13px">独立窗口支持透明或绿幕背景。打开后，当前预览停止播放，避免双重声音。欢迎不会自动识别主播是否在讲话。</p><div id="player" class="badge">声音尚未启用</div></section>
<section class="panel"><h2>运行记录</h2><div id="logs"></div></section>
</div></div></main>
<script>
const $=s=>document.querySelector(s);async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'请求失败，请检查输入');return data}
$('#enter').onclick=async()=>{try{const x=await post('/api/enter',{uid:$('#uid').value.trim(),name:$('#name').value.trim()});$('#result').textContent=x.accepted?'已接收，正在准备欢迎语音。':x.reason}catch(e){$('#result').textContent=e.message}};
$('#bind').onclick=async()=>{try{await post('/api/connection/bind')}catch(e){$('#connection-error').textContent=e.message}};$('#unbind').onclick=()=>post('/api/connection/unbind');
$('#connect').onclick=async()=>{try{await post('/api/connection/start',{room:$('#room').value.trim()});$('#connection-error').textContent=''}catch(e){$('#connection-error').textContent=e.message}};$('#disconnect').onclick=()=>post('/api/connection/stop');
let n=1;$('#new').onclick=()=>{$('#uid').value='demo-'+Date.now();$('#name').value=['技术同学','小林','阿杰','新朋友'][n++%4]};
$('#mute').onclick=()=>post('/api/mute');$('#open').onclick=()=>{const w=window.open('/overlay?green=1','welcome-overlay','width=600,height=760');if(w){$('#preview').src='about:blank';$('#result').textContent='请在新窗口启用声音；关闭新窗口后，刷新本页可恢复预览。'}};
async function refresh(){try{const s=await(await fetch('/api/status')).json();$('#mode').textContent=s.mode;const c=s.connection||{};$('#binding').textContent=s.bound_room?'已绑定 '+s.bound_room+' · 下次启动自动连接':'未绑定直播间';$('#bind').disabled=c.state!=='connected';$('#unbind').disabled=!s.bound_room;$('#connection').textContent=(c.room?'直播间 '+c.room+' · ':'')+'已收消息 '+(c.messages||0)+' · 进房 '+(c.members||0)+' · 已接受 '+(c.accepted||0)+' · 已跳过 '+(c.skipped||0);$('#connection-error').textContent=c.error||'';$('#connect').disabled=['resolving','connecting','connected','reconnecting','stopping'].includes(c.state);$('#mute').textContent=s.muted?'恢复欢迎':'暂停欢迎';$('#player').textContent=s.player?'角色窗口已就绪':'声音尚未启用';$('#logs').replaceChildren(...s.logs.map(x=>{const d=document.createElement('div');d.className='log';d.textContent=x.time+'  '+x.message;return d}))}catch(e){$('#mode').textContent='服务连接中断'}finally{setTimeout(refresh,1000)}}refresh();
</script></html>
